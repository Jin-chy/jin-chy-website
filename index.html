<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Makes the page scale correctly on phones -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Changye Jin | Portfolio</title>
  <meta name="description" content="Changye Jin, Information Technology & Management student at the University at Buffalo. Data analysis, IT, and cybersecurity.">

  <!-- Open Graph tags: control the preview when the link is shared -->
  <meta property="og:title" content="Changye Jin | Portfolio">
  <meta property="og:description" content="IT & Management student at UB focused on data analysis, IT, and cybersecurity.">
  <meta property="og:type" content="website">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230474C4'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'>CJ</text></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Apply the saved theme BEFORE React loads, so the page doesn't flash the wrong colors -->
  <script>
    try {
      var saved = localStorage.getItem("theme");
      if (saved === "light" || saved === "dark") document.documentElement.setAttribute("data-theme", saved);
    } catch (e) { /* storage blocked: follow the system setting */ }
  </script>
</head>
<body>
  <!-- React draws the whole site inside this div (see src/main.jsx) -->
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
